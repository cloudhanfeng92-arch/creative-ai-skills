<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>代码动态视频 · Project template</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #12181b; }
      body { display: grid; place-items: center; }
      #stage-frame { width: min(100vw, calc(100vh * var(--video-ratio, 1.777778))); aspect-ratio: var(--video-ratio, 1.777778); }
      canvas { display: block; width: 100%; height: 100%; }
      #player-controls { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; box-sizing: border-box; max-width: calc(100vw - 32px); padding: 10px 14px; border-radius: 14px; background: #12181be8; color: #f1eee7; font: 13px system-ui, sans-serif; }
      #player-controls[hidden], #player-controls [hidden] { display: none; }
      #player-controls button { white-space: nowrap; padding: 6px 10px; border: 1px solid #596461; border-radius: 7px; background: transparent; color: inherit; cursor: pointer; }
      #player-progress { width: min(30vw, 280px); min-width: 48px; accent-color: #ef5b34; }
      #player-time { white-space: nowrap; font-variant-numeric: tabular-nums; }
      html[data-render="true"] #stage-frame { width: 100vw; height: 100vh; aspect-ratio: auto; }
      html[data-render="true"] #player-controls { display: none; }
    </style>
  </head>
  <body>
    <div id="stage-frame"><canvas id="stage" aria-label="An original motion design demonstration"></canvas></div>
    <nav id="player-controls" aria-label="动画播放控制" hidden>
      <button id="player-toggle" type="button">播放</button>
      <button id="player-restart" type="button">重播</button>
      <input id="player-progress" type="range" min="0" max="15" step="0.01" value="0" aria-label="播放进度" />
      <span id="player-time">0:00 / 0:15</span>
      <button id="player-sound" type="button" aria-pressed="false" hidden>开启声音</button>
    </nav>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
